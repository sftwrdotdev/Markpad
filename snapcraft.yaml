name: markpad
title: Markpad
adopt-info: markpad
icon: src-tauri/icons/128x128.png
summary: The Notepad equivalent for Markdown
description: |
  A lightweight, minimalist Markdown viewer and text editor built for productivity across Windows, macOS, and Linux.
  Features:
  -   Tabbed interface
  -   Monaco editor
  -   Split view
  -   Syntax highlighting both in editor and code blocks
  -   Math equation support (KaTeX)
  -   Mermaid diagram support
  -   Vim mode
  -   Auto-reload
  -   Zen mode
  -   Custom typography and font settings
  -   Content zooming
  -   Image and YouTube embeds
  -   Familiar GitHub styled markdown rendering
  -   Tiny memory usage (~10MB)
  -   No telemetry or bloat
  -   Free and open-source
  -   Lightweight native UI
license: BSD-3-Clause
website: https://markpad.sftwr.dev
donation: https://github.com/sponsors/alecdotdev
source-code: https://github.com/sftwrdotdev/Markpad
issues: https://github.com/sftwrdotdev/Markpad/issues

confinement: strict
base: core24
grade: stable

apps:
  markpad:
    command: bin/markpad
    desktop: usr/share/applications/markpad.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - wayland
      - home

parts:
  # snapcraft's rust plugin refuses to build unless it can see rustup, and it
  # looks for it in exactly one place other than PATH: a part named `rust-deps`
  # that the rust part depends on. Naming the snap in `build-snaps` below is not
  # enough, and had not been since v2.6.11 --
  #
  #   Environment validation failed for part 'markpad': 'rustup' not found and
  #   part 'markpad' does not depend on a part named 'rust-deps' that would
  #   satisfy the dependency.
  #
  # -- which the release workflow swallowed under `continue-on-error`, so the
  # Snap Store went on serving 2.6.11 for three months and six versions while
  # every release still told people to install it. The publishing step no longer
  # swallows anything (.github/workflows/publish-packages.yml); this is the
  # failure it was hiding.
  rust-deps:
    plugin: nil
    build-snaps:
      - rustup/latest/stable
    # `extensions: [gnome]` puts the gnome SDK's libraries on LD_LIBRARY_PATH
    # for every part's build, and the rustup snap's own binary then resolves
    # libc.so.6 out of the SDK instead of out of the one it was linked
    # against:
    #
    #   /snap/rustup/1504/bin/rustup: symbol lookup error:
    #   /snap/gnome-46-2404-sdk/current/usr/lib/x86_64-linux-gnu/libc.so.6:
    #   undefined symbol: __nptl_change_stack_perm, version GLIBC_PRIVATE
    #
    # This is the same shape as #463 and #499 on the AppImage side -- a
    # packaging layer putting its own copy of a library ahead of the one that
    # had to be used -- moved from the user's machine to the builder.
    #
    # Cleared for this one call rather than for the part or the build: the
    # `node/20/stable` snap below runs under the same LD_LIBRARY_PATH and has
    # always been fine, and the markpad part links against the SDK on purpose.
    override-build: |
      env -u LD_LIBRARY_PATH rustup default stable

  markpad:
    after: [rust-deps]
    plugin: rust
    source: .
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libssl-dev
      - libgtk-3-dev
      - libappindicator3-dev
      - librsvg2-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libsoup-3.0-0
      - libjavascriptcoregtk-4.1-0
    build-snaps:
      - node/20/stable
    override-build: |
      set -e
      craftctl set version="$(node -p "require('./package.json').version")"
      npm ci
      export CARGO_BUILD_JOBS=2
      npx tauri build --no-bundle
      
      # The binary is built in src-tauri/target/release/
      install -D -m755 src-tauri/target/release/Markpad $CRAFT_PART_INSTALL/bin/markpad
      
      # Install the icon
      install -D -m644 src-tauri/icons/128x128.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/markpad.png
      install -D -m644 src-tauri/icons/32x32.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/32x32/apps/markpad.png
      
      # Install the desktop file
      cat << EOF > markpad.desktop
      [Desktop Entry]
      Name=Markpad
      Exec=markpad
      Icon=markpad
      Type=Application
      Categories=Utility;TextEditor;
      MimeType=text/markdown;text/plain;
      EOF
      install -D -m644 markpad.desktop $CRAFT_PART_INSTALL/usr/share/applications/markpad.desktop
