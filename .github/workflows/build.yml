name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Get Version
        id: get_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Every Markpad up to v2.7.0 has the pre-transfer endpoint compiled in and
      # reaches the current feed only through GitHub's transfer redirect, which a
      # repository or fork at the old location voids permanently. RELEASING.md §5
      # has the detail; this is the part that notices.
      #
      # The assertion is the property, not a proxy for it. It does not ask whether
      # a redirect exists — something may legitimately occupy the old location, so
      # long as that URL still yields this repository's feed. It asks for the feed
      # and checks where the feed points. A network failure is not evidence either
      # way and warns instead of blocking a release on a flake.
      - name: The endpoint old installs still use must lead to this repository
        shell: bash
        run: |
          legacy='https://github.com/alecdotdev/Markpad/releases/latest/download/latest.json'
          feed=''
          for attempt in 1 2 3; do
            if feed=$(curl -fsSL --max-time 30 "$legacy"); then break; fi
            feed=''
            sleep $(( attempt * 5 ))
          done

          if [ -z "$feed" ]; then
            echo "::warning::Could not fetch $legacy after three attempts. Treating as unknown, not as failure."
            exit 0
          fi

          urls=$(printf '%s' "$feed" | jq -r '.platforms | to_entries[] | .value.url' 2>/dev/null || true)
          if [ -z "$urls" ]; then
            echo "::error::$legacy answered, but not with an updater feed. Every install up to v2.7.0 asks this URL for its updates and will now be told there is none. See RELEASING.md section 5."
            exit 1
          fi

          foreign=$(printf '%s\n' "$urls" | grep -v "$GITHUB_REPOSITORY/" || true)
          if [ -n "$foreign" ]; then
            echo "::error::$legacy serves a feed pointing somewhere other than $GITHUB_REPOSITORY:"
            printf '  %s\n' $foreign
            echo "::error::Installs up to v2.7.0 would follow it. See RELEASING.md section 5."
            exit 1
          fi

          echo "$legacy still serves a feed for $GITHUB_REPOSITORY."

      # A download table, above the generated changelog.
      #
      # GitHub's asset list is one flat, alphabetically sorted column: there is
      # no way to group it by platform, and the file names alone do not say
      # which of the two Windows executables installs and which does not. The
      # release BODY is the one part of that page this repository controls, so
      # the table goes there, and every row is a direct link.
      #
      # Version-stamped file names are what the bundler produces and what
      # `latest.json` points at, so they are written out here rather than using
      # the `/releases/latest/download/<name>` permalink, which only works for
      # names that carry no version.
      - name: Compose the download table
        id: download_table
        run: |
          VERSION='${{ steps.get_version.outputs.version }}'
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          {
            echo 'body<<RELEASE_BODY'
            echo '## Download'
            echo
            echo '| System | Chip | Download | |'
            echo '|---|---|---|---|'
            echo "| **Windows** | Intel / AMD | [\`Markpad_${VERSION}_x64-setup.exe\`](${BASE}/Markpad_${VERSION}_x64-setup.exe) | installer |"
            echo "| | Intel / AMD | [\`Markpad_${VERSION}_x64.exe\`](${BASE}/Markpad_${VERSION}_x64.exe) | portable |"
            echo "| | ARM64 | [\`Markpad_${VERSION}_arm64-setup.exe\`](${BASE}/Markpad_${VERSION}_arm64-setup.exe) | installer |"
            echo "| | ARM64 | [\`Markpad_${VERSION}_arm64.exe\`](${BASE}/Markpad_${VERSION}_arm64.exe) | portable |"
            echo "| **macOS** | Intel **and** Apple Silicon | [\`Markpad_${VERSION}_universal.dmg\`](${BASE}/Markpad_${VERSION}_universal.dmg) | one file for both |"
            echo "| **Linux** | x86-64 | [\`Markpad_${VERSION}_amd64.AppImage\`](${BASE}/Markpad_${VERSION}_amd64.AppImage) | portable |"
            echo "| | x86-64 | [\`Markpad_${VERSION}_amd64.deb\`](${BASE}/Markpad_${VERSION}_amd64.deb) | Debian, Ubuntu |"
            echo "| | x86-64 | [\`Markpad-${VERSION}-1.x86_64.rpm\`](${BASE}/Markpad-${VERSION}-1.x86_64.rpm) | Fedora, RHEL, openSUSE |"
            echo
            echo '> [!NOTE]'
            echo '> **Windows SmartScreen Notice**: Windows executables are not currently signed with an Authenticode code signing certificate. Windows SmartScreen may flag the binaries as an unrecognized file or false positive Trojan. You can safely bypass SmartScreen by clicking *"More info"* → *"Run anyway"*.'
            echo
            echo '> [!NOTE]'
            echo '> **macOS Gatekeeper Notice**: the `.dmg` is not yet notarized, so the first launch is refused — *"Markpad cannot be opened because the developer cannot be verified"* — and the dialog offers only **Cancel** and **Move to Trash**. Two ways past it, both one-time:'
            echo '>'
            echo '> - **Control-click** (right-click) `Markpad.app` in Finder → **Open** → **Open**. That dialog has the button the double-click one does not.'
            echo '> - Or double-click once and press **Cancel**, then go to **System Settings → Privacy & Security**, scroll to **Security**, and press **Open Anyway** beside the message naming Markpad. Authenticate with your password or Touch ID and confirm.'
            echo '>'
            echo '> Being unsigned also means macOS grants file access per prompt instead of remembering it, so Markpad may keep asking for permission — most visibly with auto-save on (it can be turned off in Settings; closing a tab still offers to save) and in documents with many local images, which can ask once per image. Signing the app yourself on your own Mac ends that: see [this comment on #209](https://github.com/sftwrdotdev/Markpad/issues/209#issuecomment-5225897226) — a code-signing certificate made in Keychain Access plus `codesign --force --deep`, or the Sentinel app. It has to be redone after each update.'
            echo
            echo 'The two Windows files differ only in that one installs and one does not.'
            echo 'Package managers: `choco install markpad-app` (Windows), `sudo snap install markpad` (Linux).'
            echo
            echo '## What Markpad renders'
            echo
            echo "Every syntax Markpad renders is in one document — [**download \`markdown-syntax.md\`**](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/samples/markdown-syntax.md) ([简体中文](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/samples/markdown-syntax.zh-CN.md)) and open it in Markpad: the preview shows each feature working, the editor beside it shows how each one is written. Give the same file to an AI and it knows exactly what Markpad can render: ask it to reformat a document you already have, or to write a new one that uses the whole range — callouts, tables, footnotes, maths, diagrams — and open the result here. [Read it on GitHub](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/samples/markdown-syntax.md)."
            echo
            echo '---'
            echo 'RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Markpad v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.download_table.outputs.body }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            arch: x64
            target: ''
            rust_target: ''
          - platform: windows-latest
            os: windows
            arch: arm64
            target: 'aarch64-pc-windows-msvc'
            rust_target: 'aarch64-pc-windows-msvc'
          - platform: ubuntu-24.04
            os: linux
            arch: x64
            target: ''
            rust_target: ''
          - platform: macos-latest
            os: macos
            arch: universal
            target: 'universal-apple-darwin'
            rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          rpm \
          libwebkit2gtk-4.1-0 \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-0 \
          libjavascriptcoregtk-4.1-dev \
          gir1.2-javascriptcoregtk-4.1 \
          gir1.2-webkit2-4.1
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils \
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Frontend Dependencies
        run: npm ci

      # --- Windows Build (x64) ---
      - name: Build Windows x64
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Windows x64 Artifacts
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cp src-tauri/target/release/Markpad.exe "Markpad_${VERSION}_x64.exe"
          gh release upload v$VERSION "Markpad_${VERSION}_x64.exe" --clobber
          find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -exec gh release upload v$VERSION {} --clobber \;
          find src-tauri/target/release/bundle/nsis -name "*-setup.exe.sig" -exec gh release upload v$VERSION {} --clobber \;

      # --- Windows Build (ARM64) ---
      - name: Build Windows ARM64
        if: matrix.platform == 'windows-latest' && matrix.arch == 'arm64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 Artifacts
        if: matrix.platform == 'windows-latest' && matrix.arch == 'arm64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cp src-tauri/target/aarch64-pc-windows-msvc/release/Markpad.exe "Markpad_${VERSION}_arm64.exe"
          gh release upload v$VERSION "Markpad_${VERSION}_arm64.exe" --clobber
          find src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis -name "*-setup.exe" -exec gh release upload v$VERSION {} --clobber \;
          find src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis -name "*-setup.exe.sig" -exec gh release upload v$VERSION {} --clobber \;

      # --- Linux Build ---
      - name: Pre-download AppImage Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          mkdir -p ~/.cache/tauri
          wget -q https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 -O ~/.cache/tauri/AppRun-x86_64
          wget -q https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage -O ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Build Linux
        if: matrix.platform == 'ubuntu-24.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Why the AppImage has to be repacked at all, and what is removed, is in
      # scripts/strip-appimage.sh. It is a script rather than a heredoc because
      # this is the step that failed in two of the three v2.7.2 release
      # attempts, and an inline one can only be exercised by cutting a release.
      - name: Strip host-coupled libraries from AppImage
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found to repackage" >&2
            exit 1
          fi
          echo "APPIMAGE=$(realpath "$APPIMAGE")" >> "$GITHUB_ENV"
          bash scripts/strip-appimage.sh "$APPIMAGE"

      # tauri build already produced a .sig for the pre-strip file, which no
      # longer matches what the updater will download. Signing is kept out of
      # the script so the script can be run on any AppImage without a key.
      - name: Re-sign the repacked AppImage
        if: matrix.platform == 'ubuntu-24.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri signer sign -- "$APPIMAGE"
          if [ ! -f "$APPIMAGE.sig" ]; then
            echo "::error::signer sign did not produce $APPIMAGE.sig" >&2
            exit 1
          fi
          ls -la "$APPIMAGE" "$APPIMAGE.sig"

      - name: Upload Linux Artifacts
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;
          find src-tauri/target/release/bundle/rpm -name "*.rpm" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;
          find src-tauri/target/release/bundle/appimage -name "*.AppImage.sig" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;

      # --- MacOS Build ---
      - name: Build MacOS (Universal)
        if: matrix.platform == 'macos-latest'
        env:
          # Fix OOM issue
          NODE_OPTIONS: "--max-old-space-size=8192"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload MacOS Artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;
          find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;
          find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz.sig" -exec gh release upload v${{ needs.create-release.outputs.version }} {} --clobber \;

  generate-update-feed:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    # The updater feed must describe a complete release. Do not publish an
    # update if any platform build failed or was cancelled.
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result == 'success' }}
    steps:
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./sigs
          # Fail loudly on auth/rate-limit/transient issues — never silently
          # publish an empty latest.json that would overwrite a previously-good one.
          gh release download "v$VERSION" --repo "$REPO" --pattern "*.sig" --dir ./sigs

          # Default Tauri v2 updater mode: macOS .app.tar.gz, Windows NSIS *-setup.exe, Linux *.AppImage
          # (NOT v1Compatible mode — which would use .nsis.zip / .AppImage.tar.gz wrappers)
          MAC_SIG=$(ls ./sigs/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          WIN_X64_SIG=$(ls ./sigs/*x64*-setup.exe.sig 2>/dev/null | head -1 || true)
          WIN_ARM_SIG=$(ls ./sigs/*arm64*-setup.exe.sig 2>/dev/null | head -1 || true)
          LINUX_SIG=$(ls ./sigs/*.AppImage.sig 2>/dev/null | head -1 || true)

          if [ -z "$MAC_SIG" ] || [ -z "$WIN_X64_SIG" ] || [ -z "$WIN_ARM_SIG" ] || [ -z "$LINUX_SIG" ]; then
            echo "ERROR: release v${VERSION} is missing one or more required updater signatures. Aborting before publishing latest.json." >&2
            exit 1
          fi

          platform_entry() {
            local sig_file="$1"
            if [ -z "$sig_file" ] || [ ! -f "$sig_file" ]; then
              printf 'null'
              return
            fi
            local artifact
            artifact=$(basename "${sig_file%.sig}")
            # Strip CR/LF that Windows-produced .sig files may carry; minisign signatures
            # don't contain whitespace within the payload, so it's safe to remove.
            local sig
            sig=$(tr -d '\r\n' < "$sig_file")
            local url="https://github.com/${REPO}/releases/download/v${VERSION}/${artifact}"
            jq -n --arg sig "$sig" --arg url "$url" '{signature: $sig, url: $url}'
          }

          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          DARWIN_AARCH64=$(platform_entry "$MAC_SIG")
          DARWIN_X86_64=$(platform_entry "$MAC_SIG")
          WINDOWS_X86_64=$(platform_entry "$WIN_X64_SIG")
          WINDOWS_AARCH64=$(platform_entry "$WIN_ARM_SIG")
          LINUX_X86_64=$(platform_entry "$LINUX_SIG")

          # Every key below is a plain {os}-{arch}, and that is load-bearing.
          #
          # tauri-plugin-updater looks up two keys in order: {os}-{arch}-{installer}
          # first, then {os}-{arch}. The first is only tried when the binary knows
          # its own bundle type, and ours does not on Windows or Linux --
          # `__TAURI_BUNDLE_TYPE` is written into the binary by patching it after
          # the build, and that patch fails on both, three times in the v2.7.0 run:
          #   Warn Failed to add bundler type to the binary: __TAURI_BUNDLE_TYPE
          #   variable not found in binary. ... Updater plugin may not be able to
          #   update this package.
          # macOS is unaffected: tauri-utils returns BundleType::App there without
          # reading the variable.
          #
          # So Windows and Linux clients ask only for {os}-{arch}, which is what
          # this file publishes, and the warning is inert for us.
          #
          # Adding a per-installer key -- "windows-x86_64-nsis" say -- would end
          # that. It would be the key those clients cannot ask for, so they would
          # keep resolving the unsuffixed one and silently ignore the new entry;
          # remove the unsuffixed one in the same edit and they get
          # TargetsNotFound and stop updating. If per-installer keys are ever
          # wanted, the missing bundle type has to be fixed first.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${REPO}/releases/tag/v${VERSION}" \
            --arg pub_date "$DATE" \
            --argjson darwin_aarch64 "$DARWIN_AARCH64" \
            --argjson darwin_x86_64 "$DARWIN_X86_64" \
            --argjson windows_x86_64 "$WINDOWS_X86_64" \
            --argjson windows_aarch64 "$WINDOWS_AARCH64" \
            --argjson linux_x86_64 "$LINUX_X86_64" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ({
                "darwin-aarch64":   $darwin_aarch64,
                "darwin-x86_64":    $darwin_x86_64,
                "windows-x86_64":   $windows_x86_64,
                "windows-aarch64":  $windows_aarch64,
                "linux-x86_64":     $linux_x86_64
              } | with_entries(select(.value != null)))
            }' > latest.json

          cat latest.json
          gh release upload "v$VERSION" latest.json --clobber --repo "$REPO"
