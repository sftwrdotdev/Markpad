name: Test

on:
  pull_request:
  # Contributors now branch inside this repository instead of a fork, so a
  # commit can reach master without ever having been a pull request. Without
  # this trigger no workflow listens to `push` at all and such a commit is
  # never tested. Restricted to master: pull request branches already run the
  # suite through the `pull_request` trigger above.
  push:
    branches:
      - master

# A pull request branch gets pushed to repeatedly, and every push queued
# another full run of this suite while the previous revision was still being
# tested. Only the newest revision of a branch is worth testing -- the same
# reasoning test_build.yml already applies to its platform matrix.
#
# `github.ref` is `refs/pull/<n>/merge` under the pull_request trigger and
# `refs/heads/master` under the push trigger, so the two triggers land in
# different groups and neither can cancel the other.
#
# Cancellation is restricted to pull requests. The push trigger exists because
# a commit can reach master without ever having been a pull request (see the
# comment above it); cancelling a master run because a second commit landed
# would leave the first one untested, which is the exact hole that trigger was
# added to close.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      # Nothing in this repository cached cargo output, so every job compiled
      # the whole dependency graph from scratch. Measured on the Linux
      # `build-test` job of run 31382758646: `cargo test` took 2m31s and the
      # release `Build app` 7m57s out of 12m14s -- 86% of the job was Rust
      # compilation, none of it reused.
      #
      # `src-tauri` is the cargo workspace root. Without naming it the action
      # looks for Cargo.lock at the repository root, finds none and caches
      # nothing.
      #
      # A pull request can only restore caches written on its own branch or on
      # the base branch, so master runs are what seed a freshly opened branch.
      # This job and test_build.yml's matrix both run on push to master for
      # that reason, and `save-if` keeps them the only writers: a pull request
      # restores and saves nothing.
      #
      # That bound is not cosmetic. One run's cargo caches measured 4.45 GB
      # against a 10 GB per-repository limit shared with ~110 npm caches, and
      # GitHub evicts least-recently-used -- so unbounded per-branch copies
      # would push out the very entries they are meant to reuse.
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: audit complete dependency lockfile
        run: npm audit

      - name: check frontend
        run: npm run check

      - name: run frontend behavior tests
        run: npm test

      - name: run cargo test
        run: |
          cd src-tauri
          cargo test
