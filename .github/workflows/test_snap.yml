name: Test Snap Build (No Publish)

# snapcraft.yaml is the only build in this repository that no pull request has
# ever run. It is built from publish-packages.yml, which checks out a release
# tag -- so a change to snapcraft.yaml is first executed after it has been
# merged, tagged and published, and the release it breaks is the one users are
# already being pointed at. That is exactly how #566's rust-deps fix reached
# v2.7.3 as a failed publish.
#
# This packs the snap and stops. Nothing is uploaded to the release and nothing
# is pushed to the Snap Store; that stays in publish-packages.yml behind a
# release a human published. A green run here means `snapcraft pack` produced a
# .snap, which is the half that has been failing.
#
# Path-filtered because it costs ~20 minutes and recompiles the whole app
# inside LXD. `.github/workflows/test_snap.yml` is in the list so a change to
# this file tests itself.

on:
  pull_request:
    paths:
      - snapcraft.yaml
      - .github/workflows/test_snap.yml
  # The pull request trigger above catches us breaking this. It cannot catch
  # snapcraft breaking it, and that is what actually happened: the Snap Store
  # served 2.6.11 for three months and six versions because `snap install
  # snapcraft --classic` went from 8.14.5 to 9.0.1 between two releases and the
  # 9.x rust plugin refused a snapcraft.yaml nobody had touched. No commit here
  # was involved, so no path filter could ever have fired.
  #
  # Once a month is the sampling rate for that. The pack is ~6 minutes now that
  # it repackages the release's .deb instead of compiling, so twelve runs a year
  # is not a budget question; the point is that a snapcraft 10 lands on a
  # scheduled run rather than on a release.
  #
  # It fails to whoever GitHub notifies for scheduled workflows, which is worse
  # than a red pull request and better than a green release. If that stops being
  # read, the answer is to make it louder rather than to delete it -- the
  # alternative is what the three months were.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: test-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Snapcraft
        run: |
          set -euo pipefail
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic
          # The workflow installs whatever the store is serving today, and the
          # 8.x -> 9.x bump between v2.6.11 and v2.6.12 is what broke the snap
          # in the first place. Print it, so a future failure of that shape is
          # one line away rather than a bisect.
          snap list snapcraft

      # snapcraft.yaml packages a .deb rather than building one, and a pull
      # request has no release of its own to take one from. The latest release's
      # is the right stand-in: what is under test here is snapcraft.yaml, and a
      # .deb is a .deb. The snap this produces is thrown away.
      - name: Take a .deb to package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_amd64.deb' \
            --output markpad.deb
          dpkg-deb -f markpad.deb Package Version Architecture

      - name: Pack
        run: |
          set -euo pipefail
          sg lxd -c 'snapcraft pack' 2>&1 | tee pack.log
          ls -la ./*.snap

      # During priming, snapcraft resolves what the staged binaries need against
      # the base, the extension and stage-packages, and names anything it could
      # not place -- as a warning, and a warning in a several-hundred-line log
      # is not a result. This is the one place the resolution happens in the
      # environment the snap will actually run in, so it is worth promoting to a
      # failure. The binary names 16 libraries; two of them, libssl.so.3 and
      # libcrypto.so.3, are in neither stage-packages nor obviously in the gnome
      # runtime, which is what makes this worth asserting rather than assuming.
      #
      # It reads snapcraft's wording, so a reworded warning would pass silently.
      # Running the snap is what would catch that, and needs a display; the
      # AppImage smoke test is where that belongs.
      - name: snapcraft placed every library the binary asks for
        run: |
          set -euo pipefail
          if grep -qi 'missing dependencies' pack.log; then
            grep -i -A20 'missing dependencies' pack.log
            echo "::error::snapcraft could not place a library the binary needs" >&2
            exit 1
          fi
          echo "No missing-dependency report in the pack log."
