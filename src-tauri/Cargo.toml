[package]
name = "Markpad"
version = "2.7.3"
description = "Simple Markdown viewer and text editor"
authors = ["Alec Ames <dev@alecames.com>"]
license = "BSD-3-Clause"
edition = "2021"

[[bin]]
name = "Markpad"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = ">=2.2.2, <3"
serde = { version = "1", features = ["derive"] }
comrak = "0.54"
serde_json = "1"
tauri-plugin-prevent-default = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "8"
regex = "1"
# For the `asset:` protocol handler in `asset_protocol`. All three are already
# in the lock file as transitive dependencies of tauri, so naming them here
# adds no crate to the build.
http = "1"
http-range = "0.1"
percent-encoding = "2"
tauri-utils = "2"

reqwest = "0.13"
zip = { version = "2.1", default-features = false, features = ["deflate", "time"] }
opener = { version = "0.7", features = ["reveal"] }
font-kit = "0.14"
base64 = "0.22"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
chardetng = "1"
encoding_rs = "0.8"



[target.'cfg(windows)'.dependencies]
winreg = "0.55"
webview2-com = "0.38.2"
windows = "0.61.3"

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
